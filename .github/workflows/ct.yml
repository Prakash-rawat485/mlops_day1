name: CT Pipeline

on:
  push:
    paths:
      - 'data/**'
      - 'src/train.py'
    branches: [ main ]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain Model & Update MLflow Registry
        run: |
          python src/train.py

      - name: Commit Updated MLflow Database and Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlflow.db mlruns/
          if git diff --staged --quiet; then
            echo "No updates to MLflow tracking."
          else
            git commit -m "Automated model retraining (MLflow Champion Update)"
            git push
          fi

      - name: Trigger CI Validation Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref main